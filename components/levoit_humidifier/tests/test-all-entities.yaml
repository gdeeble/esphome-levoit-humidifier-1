# Compile test: every platform and entity type, using the local component.
esphome:
  name: levoit-test

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

external_components:
  - source:
      type: local
      path: ../..
    components: [levoit_humidifier]

logger:

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

levoit_humidifier:

switch:
  - platform: levoit_humidifier
    type: power
    name: Power
  - platform: levoit_humidifier
    type: auto_stop
    name: Auto Off
  - platform: levoit_humidifier
    type: display
    name: Display

select:
  - platform: levoit_humidifier
    type: mode
    name: Mode

number:
  - platform: levoit_humidifier
    type: target_humidity
    name: Target humidity
  - platform: levoit_humidifier
    type: mist_level
    name: Mist level
    mode: slider
  - platform: levoit_humidifier
    type: timer
    name: Timer
    mode: box

sensor:
  - platform: levoit_humidifier
    type: humidity
    name: Humidity
  - platform: levoit_humidifier
    type: temperature
    name: Temperature

binary_sensor:
  - platform: levoit_humidifier
    type: low_water
    name: Low water
  - platform: levoit_humidifier
    type: water_tank_lifted
    name: Water tank lifted
  - platform: levoit_humidifier
    type: mist_active
    name: Mist active
  - platform: levoit_humidifier
    type: auto_stopped
    name: Target reached
  - platform: levoit_humidifier
    type: clean_reminder
    name: Clean tank reminder
  - platform: levoit_humidifier
    type: humidity_high
    name: Humidity high
  - platform: levoit_humidifier
    type: error
    name: Error
  - platform: levoit_humidifier
    type: night_light
    name: Night light

text_sensor:
  - platform: levoit_humidifier
    type: mcu_version
    name: Firmware
  - platform: levoit_humidifier
    type: night_light_mode
    name: Night light mode
  - platform: levoit_humidifier
    type: night_light_color
    name: Night light color

button:
  - platform: levoit_humidifier
    type: reset_clean_reminder
    name: Reset clean reminder

